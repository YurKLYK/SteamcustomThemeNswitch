name: Publish installer
on:
  push:
    branches: [main]
    paths: ['theme.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-installer
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package
        shell: pwsh
        run: |
          ./tools/validate-theme.ps1
          ./tools/build-package.ps1
          Copy-Item Setup.cmd dist/Setup.cmd
          Copy-Item Artwork-Resizer.html dist/Artwork-Resizer.html
          Get-FileHash dist/Setup.cmd,dist/Artwork-Resizer.html,dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content theme.json -Raw | ConvertFrom-Json).version
          gh release view $version --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; increment theme.json before publishing.' }
          gh release create $version dist/Setup.cmd dist/Artwork-Resizer.html dist/*.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Switch Home for Steam $version" --notes "Download Setup.cmd and run it. Artwork-Resizer.html is a standalone offline 600x900 cover tool. This update adds favorites sorting, shortcut custom artwork, flat settings and HOME polish. Steam sign-in, CSSLoader Backend installation and theme activation remain manual. See README and CHANGELOG for usage and verification limitations."
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
